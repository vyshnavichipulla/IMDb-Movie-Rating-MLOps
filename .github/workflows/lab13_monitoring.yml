
name: Lab 13 - End-to-End MLOps

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  mlops-pipeline:
    name: IMDb MLOps Pipeline
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Lab 12 and Lab 13
        run: |
          python main.py

      - name: Build Docker Image
        run: |
          docker build -t imdb-mlops .

      - name: Verify Lifecycle Report
        run: |
          test -f outputs/lifecycle_report.json
          cat outputs/lifecycle_report.json
